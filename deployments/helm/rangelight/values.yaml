---
# Every key is validated by values.schema.json. Rangelight installs into the namespace "rangelight-system" only.

# Where browsers reach Rangelight: https://<host>[:<port>], without a path. Required. The api takes state-changing
# requests and WebSocket upgrades from this origin only, and bundled Dex is the issuer <publicUrl>/dex.
publicUrl: ""

# The cluster DNS pods: the only DNS server a lane may query (through Cilium's DNS proxy, which answers only
# Anthropic's hosts and the mirror) and the only one Dex may. Distributions label CoreDNS differently: check with
# `kubectl -n kube-system get pods --show-labels`. RKE2: podLabel "k8s-app=coredns".
clusterDns:
  namespace: "kube-system"
  # One label that selects them, as key=value.
  podLabel: "k8s-app=kube-dns"

# The cluster's pod and service CIDRs. The api's and Dex's HTTPS (Linear, GitHub, your OIDC provider) may go anywhere
# but these. The defaults are k3s's and RKE2's (and so k3d's); kubeadm with Calico or Flannel: 192.168.0.0/16 or
# 10.244.0.0/16, and 10.96.0.0/12.
clusterCidrs:
  - "10.42.0.0/16"
  - "10.43.0.0/16"

# One Ingress (networking.k8s.io/v1) for the host of publicUrl: the api's Connect services, /auth and /v1alpha1/sessions
# (the terminal WebSocket) to the api, /dex to bundled Dex, and everything else to the Workbench. The chart installs no controller.
ingress:
  # true: render the Ingress. It needs api.enabled, web.enabled and ingress.from.
  enabled: false
  # The IngressClass; empty: the cluster's default class.
  className: ""
  # Annotations for your controller (timeouts, body size and the like), as given. The chart sets none: the terminal
  # WebSocket and WatchSession are long-lived, so raise your controller's read timeout here if it has one.
  annotations: {}
  tls:
    # The TLS Secret for the host, in rangelight-system; you create it. Empty: TLS ends before the Ingress (publicUrl
    # is https either way).
    secretName: ""
  # Who routes browsers to the api, the Workbench and Dex: your ingress controller's pods, by their namespace's labels
  # (required when ingress.enabled) and their own labels (empty: every pod in those namespaces). The api's, the
  # Workbench's and Dex's NetworkPolicies admit these, and nothing else from outside the chart.
  # Example, ingress-nginx: namespaceLabels {kubernetes.io/metadata.name: "ingress-nginx"},
  # podLabels {app.kubernetes.io/name: "ingress-nginx"}.
  from:
    namespaceLabels: {}
    podLabels: {}
    # The HTTPS container port of those pods, after any hostPort or Service translation: the api reaches bundled
    # Dex's issuer (<publicUrl>/dex) there, and only there. ingress-nginx: 443; Traefik (websecure): 8443.
    # Required when ingress.enabled; 0: unset.
    httpsPort: 0

# Sign-in: OIDC only (ADR 0028, 0033). Bundled: Dex (dex.enabled). Your own provider: dex.enabled=false and
# oidc.issuer, with a client registered there for the redirect URI <publicUrl>/auth/callback.
oidc:
  # Your provider's issuer (https). Used, and required, only when dex.enabled is false.
  issuer: ""
  # The api's client id at the issuer. Bundled Dex registers it.
  clientId: "rangelight-api"
  # The ID-token claim that names the member (the sessions' member label). With bundled Dex it must stay
  # preferred_username: the GitHub login. With your own provider, pick a claim the provider sets and keeps
  # unique, never one users can edit (OIDC Core says not to key on preferred_username); the first account
  # to present a name owns it.
  memberClaim: "preferred_username"
  # The Secret in rangelight-system, and its key, holding the api's client secret; you create it. Bundled Dex reads
  # the same Secret, so with dex.enabled it must stay rangelight-oidc / client-secret.
  clientSecretRef:
    name: "rangelight-oidc"
    key: "client-secret"

# The api's HTTPS trust: the platform's roots, plus your own CA when the issuer or Linear is served from your own PKI.
tls:
  # The Secret in rangelight-system, and its key, holding a PEM bundle of CA certificates the api trusts beside the
  # platform's roots; you create it. Needed when the issuer (bundled Dex at <publicUrl>/dex, so whatever certificate
  # serves publicUrl, or oidc.issuer) or Linear (through a proxy) presents a certificate from your own CA; without it
  # the api refuses that certificate and sign-in answers 503. Empty name: the platform's roots only. A bundle without a
  # certificate, or with one that doesn't parse, stops the api at start.
  extraCaSecretRef:
    name: ""
    key: "ca.crt"

# Postgres, the source of truth (ADR 0021, 0031). Bundled: a CloudNativePG cluster "rangelight-pg" with the
# database "api" owned by the role "rl_api"; its credentials exist only in the Secret CloudNativePG generates
# ("rangelight-pg-app"). External: your own Postgres, through a Secret you create.
postgres:
  # true: install the CloudNativePG operator and the cluster "rangelight-pg". false: use postgres.external.
  enabled: true
  # The Postgres image, by tag and digest. The major version decides the on-disk format: never bump it in place.
  image: "ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:26d15a12723510b0b416e8aec2bc65f2da7ac9b77ef3182a0911e4b8b991420a"
  # Size of the data volume, from the default StorageClass.
  storage: "10Gi"
  # Resources of the Postgres pod.
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      memory: "1Gi"
  # Used only when postgres.enabled is false.
  external:
    # The Secret in rangelight-system, and its key, holding the api's and the relay's connection URI
    # (postgresql://<user>:<password>@<host>:5432/<database>). Its name is required when postgres.enabled is false.
    # The port is 5432: the api's and the relay's NetworkPolicies allow that port, to any address.
    secretRef:
      name: ""
      key: "uri"

# NATS JetStream, the transport (ADR 0021): one server, file storage on a PVC from the default StorageClass.
# Bundled: the upstream "nats" chart, configured by every key below except enabled and external.
nats:
  # true: install a NATS server with JetStream. false: use nats.external.
  enabled: true
  # Used only when nats.enabled is false.
  external:
    # The NATS URL the api, the relay and the runner connect to (port 4222 if none). Required when nats.enabled is
    # false. Each sends its ServiceAccount token there: tls://, or nats:// only to a Service in this cluster
    # (<name>.<namespace>.svc).
    url: ""
  # Who may connect (ADR 0021 amendment): every client signs in through the api's auth callout with its own projected
  # ServiceAccount token and gets exactly its own subjects. Rangelight's keys, not the upstream chart's.
  auth:
    # A Secret you create instead of the keys Job (GitOps, `helm template`): keys issuer-seed and auth-user-seed (the
    # api's), and, for the bundled server, issuer and auth-user (their public keys). Required when nats.enabled is
    # false. Empty: a pre-install/pre-upgrade Job creates rangelight-api-nats and rangelight-nats-auth once.
    existingSecret: ""
    # The keys Job's image (nk, curl and jq), by tag and digest.
    keysImage: "docker.io/natsio/nats-box:0.20.2@sha256:5162fca0f56ebe6f78e612e1ded143ce978e088393476033020e6251358dba6f"
    # This cluster's ServiceAccount token issuer, as its tokens name it:
    # kubectl get --raw /.well-known/openid-configuration (the "issuer" field). k3s, RKE2 and kubeadm use this default.
    issuer: "https://kubernetes.default.svc.cluster.local"
    # The accounts the api's user JWTs are for: RL (the control plane and the runners) and LANE (the lanes, limited
    # by the server to one subscription and 128 KiB each). With your own server in operator mode, their public keys;
    # existingSecret then also holds lane-issuer-seed, LANE's signing key.
    account: "RL"
    laneAccount: "LANE"
    # Without Cilium: the API server's addresses, which the api reads the token signing keys from (port 443 or 6443).
    # Required then; with Cilium the api reaches the API server by its identity and this is unused. Find them with
    # kubectl get endpointslices -n default -l kubernetes.io/service-name=kubernetes, for example ["10.0.0.5/32"].
    apiServerCidrs: []
  # The upstream chart's settings (https://github.com/nats-io/k8s/tree/main/helm/charts/nats).
  # The server's name, and so its Service: the api connects to nats://rangelight-nats.rangelight-system.svc.cluster.local:4222.
  fullnameOverride: "rangelight-nats"
  global:
    labels:
      app.kubernetes.io/part-of: "rangelight"
  config:
    jetstream:
      enabled: true
      fileStore:
        pvc:
          # Size of the JetStream volume.
          size: "10Gi"
    # templates/nats/_auth.conf.tpl, mounted from the ConfigMap rangelight-nats-auth-config: the accounts, the auth callout
    # and max_payload.
    merge:
      00$include: "../nats-auth/auth.conf"
  # Restarts the server when its config changes, instead of a reloader sidecar.
  podTemplate:
    configChecksumAnnotation: true
    merge:
      # The upstream checksum covers only its own nats.conf: this one rolls the server when our auth.conf changes.
      metadata:
        annotations:
          checksum/auth:
            $tplYaml: "{{ include \"rangelight.natsAuthConf\" . | sha256sum | quote }}"
      spec:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: "RuntimeDefault"
    # auth.conf at /etc/nats-auth; a changed one rolls the server (checksum/auth above).
    patch:
      - op: "add"
        path: "/spec/volumes/-"
        value:
          name: "auth"
          configMap:
            name: "rangelight-nats-auth-config"
  container:
    image:
      fullImageName: "docker.io/library/nats:2.15.1-alpine@sha256:7ae34c25dfd6fe2e01c6483eabef20d796690fdcac6c4d94ca780a6cf9877fde"
    # auth.conf's public keys, from the keys Job's Secret or nats.auth.existingSecret.
    env:
      RL_NATS_ISSUER:
        valueFrom:
          secretKeyRef:
            name:
              $tplYaml: "{{ .Values.auth.existingSecret | default \"rangelight-nats-auth\" | quote }}"
            key: "issuer"
      RL_NATS_AUTH_USER:
        valueFrom:
          secretKeyRef:
            name:
              $tplYaml: "{{ .Values.auth.existingSecret | default \"rangelight-nats-auth\" | quote }}"
            key: "auth-user"
    patch:
      - op: "add"
        path: "/volumeMounts/-"
        value:
          name: "auth"
          mountPath: "/etc/nats-auth"
          readOnly: true
    # Resources of the NATS server.
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        memory: "512Mi"
    merge:
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - "ALL"
  reloader:
    enabled: false
  # A disruption budget for one server would allow every disruption anyway.
  podDisruptionBudget:
    enabled: false
  natsBox:
    enabled: false

# Dex, the bundled OIDC provider (ADR 0009, 0028): GitHub sign-in limited to one organisation's members. One server
# with in-memory storage: it only brokers sign-ins, and logins live in Postgres, so a restart costs only the
# sign-ins in flight. Every key except enabled and github goes to the upstream "dex" chart.
# You create the Secret "rangelight-dex-github" (keys client-id and client-secret) for a GitHub OAuth app whose
# callback URL is <publicUrl>/dex/callback, and the Secret named by oidc.clientSecretRef.
dex:
  # true: install Dex. false: use your own provider (oidc.issuer).
  enabled: true
  github:
    # Only members of this GitHub organisation can sign in (Dex checks at each sign-in). Required when enabled.
    org: ""
  # The upstream chart's settings (https://github.com/dexidp/helm-charts/tree/master/charts/dex).
  # Its Service: rangelight-dex.rangelight-system.svc:5556. Route <publicUrl>/dex to it.
  fullnameOverride: "rangelight-dex"
  replicaCount: 1
  image:
    # The image by tag and digest: the chart renders "<repository>@<digest>".
    repository: "ghcr.io/dexidp/dex:v2.46.1"
    digest: "sha256:65b72ca0f4b0bf6d4ada84ec21da8851782563404ac7b8f926923d27ceced9ab"
  # The config is ours (templates/dex/config.yaml): it holds no credential, only $VARIABLES Dex fills from the env.
  configSecret:
    create: false
    name: "rangelight-dex-config"
  # In-memory storage: Dex never calls the Kubernetes API. Our ServiceAccount mounts no token.
  rbac:
    create: false
  serviceAccount:
    create: false
    name: "rangelight-dex"
  # The credentials, from Secrets only. The names are fixed: the config refers to these variables.
  envVars:
    - name: "GITHUB_CLIENT_ID"
      valueFrom:
        secretKeyRef:
          name: "rangelight-dex-github"
          key: "client-id"
    - name: "GITHUB_CLIENT_SECRET"
      valueFrom:
        secretKeyRef:
          name: "rangelight-dex-github"
          key: "client-secret"
    - name: "RANGELIGHT_OIDC_CLIENT_SECRET"
      valueFrom:
        secretKeyRef:
          name: "rangelight-oidc"
          key: "client-secret"
  commonLabels:
    app.kubernetes.io/part-of: "rangelight"
  podLabels:
    app.kubernetes.io/part-of: "rangelight"
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    seccompProfile:
      type: "RuntimeDefault"
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - "ALL"
  # The root stays read-only; Dex writes its rendered config to /tmp at start, so /tmp is a small memory volume.
  volumes:
    - name: "tmp"
      emptyDir:
        medium: "Memory"
        sizeLimit: "16Mi"
  volumeMounts:
    - name: "tmp"
      mountPath: "/tmp"
  # Resources of the Dex server.
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      memory: "256Mi"
  # Ours is templates/dex/networkpolicy.yaml, always rendered with Dex; the upstream one stays off (the schema
  # refuses true).
  networkPolicy:
    enabled: false

# The upstream CloudNativePG operator chart's settings (https://github.com/cloudnative-pg/charts).
cloudnative-pg:
  image:
    # The operator image: the chart's appVersion, pinned by digest.
    tag: "1.30.1@sha256:923c267ec29636db3bee20f993d0ec4973fa22998e1adad37da79e4d32b5bc07"
  config:
    # Watch rangelight-system only: namespaced RBAC, and no reach into other teams' Postgres clusters.
    clusterWide: false
  podLabels:
    app.kubernetes.io/part-of: "rangelight"
  # Resources of the operator.
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      memory: "512Mi"

# The git mirror (ADR 0011): stock git behind nginx; sessions push their checkpoints and branches to it.
gitMirror:
  # true: run the mirror. It needs gitMirror.image and at least one repo.
  enabled: false
  # The git mirror image, by tag and digest: ghcr.io/rangelight/git-mirror:<sha>@sha256:<digest>,
  # built by .github/workflows/images.yaml. Required when enabled.
  image: ""
  # The repos to mirror. Each is served at /<name>.git and fetched anonymously from its public https
  # upstream (ponytail: until Plan 4's fetch Job with a GitHub App token, ADR 0047 §3).
  # Example: [{name: "opentelemetry-demo", upstream: "https://github.com/rangelight/opentelemetry-demo.git"}]
  repos: []
  # How often each repo is fetched from upstream, in seconds (ponytail: until Plan 4's webhook-driven fetch).
  syncIntervalSeconds: 300
  # The volume for every repo: upstream repos and the per-session repos (capped at 512 MiB each).
  storage: "5Gi"

# The runner (ADR 0018): it runs Sessions (files/crds/session.yaml) as lane namespaces rl-<ticket> with a hardened agent
# pod, and answers the git mirror's /auth/git.
runner:
  # true: run the runner. It needs runner.image, runner.agentImage, the namespace runner.namespace, and Cilium.
  enabled: false
  # The runner's own namespace, which the cluster owner creates (Pod Security `restricted`) and the chart doesn't,
  # so no rangelight-system workload can mount the runner's ServiceAccount. Sessions live here.
  namespace: "rangelight-runner"
  # The runner image, by tag and digest: ghcr.io/rangelight/runner:<sha>@sha256:<digest>, built by
  # .github/workflows/images.yaml. Required when enabled.
  image: ""
  # The lane agent image (services/agent), by tag and digest: ghcr.io/rangelight/agent:<sha>@sha256:<digest>.
  # Required when enabled.
  agentImage: ""
  # How many Sessions reconcile at once. Each one may hold a depth-1 clone of a repo's base branch on /tmp for up to
  # 30 seconds while it reads rangelight.yaml.
  workers: 4
  # The runner's /tmp: at least workers times the largest base-branch snapshot (a checkout without history).
  tmpSize: "2Gi"
  # Resources of the runner pod.
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      memory: "512Mi"

# The GitHub App that publishes each session's work branch (ADR 0011, ADR 0040 §3): the runner pushes
# rangelight/<session id>/work to the repo's gitMirror.repos upstream and opens its pull request. The README's
# "Publishing to GitHub" says how to create it.
githubApp:
  # The Secret in runner.namespace, which you create, holding the App's id (key app-id) and its private key (key
  # private-key). Empty: nothing is published, and lanes work as before.
  secretRef:
    name: ""

# Linear, where the api takes tickets from (ADR 0047).
linear:
  # The team whose issues labelled "rangelight" become sessions, by its key (for example RAN). Required when
  # api.enabled.
  team: ""
  # The Secret in rangelight-system, and its key, holding a Linear API key that reads that team's issues; you create
  # it. Its name is required when api.enabled.
  apiKeySecretRef:
    name: ""
    key: "api-key"

# The api (services/api): Linear intake, the session API and sign-in, on port 8080. Its settings are the ConfigMap
# rangelight-api (configs/api.default.toml); its Postgres URI, OIDC client secret and Linear key are mounted from their
# Secrets as files. Where the team's sessions work and for whom, until repo onboarding maps teams to repos (ADR 0047)
# and members to sessions.
api:
  # true: run the api (one replica). It needs api.image, linear.team and linear.apiKeySecretRef.name.
  enabled: false
  # The api image, by tag and digest: ghcr.io/rangelight/api:<sha>@sha256:<digest>, built by
  # .github/workflows/images.yaml. Required when enabled.
  image: ""
  # The git mirror's name for the repo the sessions work on (a gitMirror.repos name, without .git). Required. Its
  # gitMirror.repos upstream, when that is https://github.com/<owner>/<repo>, is where the lanes' pull requests are:
  # the api keeps them and attaches them to their tickets.
  repo: ""
  # The repo's approved base branch: lanes start there, and the profile is read there (ADR 0041).
  baseRef: "main"
  # The member the sessions work for: their login (oidc.memberClaim, the GitHub login through Dex),
  # lowercased. Lanes mount that member's Claude home (ADR 0046 amendment), and only that login may open
  # a session's terminal. Required.
  member: ""
  # JetStream replicas of the control plane's streams (the runners' status, which the api reads, and the sessions'
  # desired state, which the relay writes): 1 for a single NATS server, 3 for a cluster.
  streamReplicas: 1
  # Resources of the api pod.
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      memory: "512Mi"

# The Workbench (services/web): its static build behind unprivileged nginx, on port 8080. It needs no config and no
# secret, and calls nothing: browsers load it, then call the api on the same origin.
web:
  # true: run the Workbench (one replica). It needs web.image.
  enabled: false
  # The web image, by tag and digest: ghcr.io/rangelight/web:<sha>@sha256:<digest>, built by
  # .github/workflows/images.yaml. Required when enabled.
  image: ""
  # Resources of the web pod.
  resources:
    requests:
      cpu: "10m"
      memory: "32Mi"
    limits:
      memory: "128Mi"

# The relay (services/relay): publishes the outbox to NATS (ADR 0031). Its Postgres URI is mounted from its Secret.
relay:
  # true: run the relay. One replica, by design: it is the outbox's single writer to NATS.
  enabled: false
  # The relay image, by tag and digest: ghcr.io/rangelight/relay:<sha>@sha256:<digest>. Required when enabled.
  image: ""
  # Resources of the relay pod.
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      memory: "256Mi"
