# golangci-lint v2 (ADR 0049 §4). Limits match ADR 0049 §7.
version: "2"

linters:
  default: none
  enable:
    - depguard
    - errcheck
    - errorlint
    - exhaustive
    - forbidigo
    - funlen
    - gocognit
    - gosec
    - govet
    - revive
    - staticcheck
    - wrapcheck
  settings:
    funlen:
      lines: 60
      statements: -1
    gocognit:
      min-complexity: 15
    depguard:
      rules:
        main:
          deny:
            - pkg: github.com/pkg/errors
              desc: use the standard library errors with %w
            - pkg: io/ioutil
              desc: deprecated; use io and os
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: log with log/slog
        - pattern: ^os\.(Getenv|LookupEnv|Environ)$
          msg: only internal/config reads the environment (ADR 0049 §6)
      analyze-types: true
  exclusions:
    rules:
      - path: ^internal/config/
        linters: [forbidigo]
        text: os\.
      - path: _test\.go$
        linters: [funlen, wrapcheck]

formatters:
  enable:
    - gofmt
    - goimports
