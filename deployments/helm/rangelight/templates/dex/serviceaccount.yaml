{{- if .Values.dex.enabled }}
---
# Dex's identity. It never calls the Kubernetes API (in-memory storage), so no token is mounted.
apiVersion: "v1"
kind: "ServiceAccount"
metadata:
  name: {{ .Values.dex.serviceAccount.name | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "rangelight.labels" (dict "ctx" $ "name" "dex" "component" "identity") | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
