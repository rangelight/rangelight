---
# The api's connection and sign-in settings (ADR 0049 §6): secrets as references, never values.
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "rangelight-api"
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "rangelight.labels" (dict "ctx" $ "name" "api" "component" "config") | nindent 4 }}
data:
  {{- if .Values.postgres.enabled }}
  RANGELIGHT_API_POSTGRES_URL: "secret://rangelight-pg-app#uri"
  {{- else }}
  RANGELIGHT_API_POSTGRES_URL: {{ printf "secret://%s#%s" .Values.postgres.external.secretRef.name .Values.postgres.external.secretRef.key | quote }}
  {{- end }}
  {{- if .Values.nats.enabled }}
  RANGELIGHT_API_NATS_URL: {{ printf "nats://%s.%s.svc:4222" .Values.nats.fullnameOverride .Release.Namespace | quote }}
  {{- else }}
  RANGELIGHT_API_NATS_URL: {{ .Values.nats.external.url | quote }}
  {{- end }}
  RANGELIGHT_API_PUBLIC_URL: {{ .Values.publicUrl | quote }}
  {{- if .Values.dex.enabled }}
  RANGELIGHT_API_OIDC_ISSUER: {{ printf "%s/dex" .Values.publicUrl | quote }}
  {{- else }}
  RANGELIGHT_API_OIDC_ISSUER: {{ .Values.oidc.issuer | quote }}
  {{- end }}
  RANGELIGHT_API_OIDC_CLIENT_ID: {{ .Values.oidc.clientId | quote }}
  RANGELIGHT_API_OIDC_MEMBER_CLAIM: {{ .Values.oidc.memberClaim | quote }}
  RANGELIGHT_API_OIDC_CLIENT_SECRET: {{ printf "secret://%s#%s" .Values.oidc.clientSecretRef.name .Values.oidc.clientSecretRef.key | quote }}
