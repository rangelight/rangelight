# Defaults for services/runner (ADR 0049 §6). Override with the mounted /etc/rangelight/runner.toml,
# then with RANGELIGHT_RUNNER_<KEY>, for example RANGELIGHT_RUNNER_AGENT_IMAGE. No secrets here, ever.

# The runner's own namespace: Sessions live here, and nowhere else (the chart sets it).
namespace = "rangelight-runner"
# The listener for the git mirror's /auth/git and for /healthz.
listen = ":8080"
# The git mirror (services/git-mirror): the profile is read from it, and lanes clone from it.
# Empty: no mirror is deployed (the chart's gitMirror.enabled=false).
mirror_url = "http://git-mirror.rangelight-system.svc.cluster.local:8080"
# The runner's own projected token for the mirror (audience rangelight-git-mirror), read at each fetch.
mirror_token_file = "/var/run/secrets/rangelight/git-mirror/token"
# The cluster DNS pods, the only DNS server a lane may query (through Cilium's DNS proxy): their namespace
# and one label that selects them. The common kube-dns label; RKE2's CoreDNS is k8s-app=coredns.
dns_namespace = "kube-system"
dns_pod_label = "k8s-app=kube-dns"
# How many Sessions reconcile at once. Each profile read is a depth-1 clone on the runner's /tmp for up
# to 30 seconds, so a slow mirror holds one worker, and /tmp holds up to this many clones.
workers = 4
# The lane agent's image (services/agent), by tag and digest. Required: the chart sets it.
agent_image = ""
# The lane agent pod's disk: the worktree's emptyDir, /tmp's emptyDir, and the container's
# ephemeral-storage limit (logs and writable layers too, so at least the sum of the two).
lane_workspace_size = "10Gi"
lane_tmp_size = "1Gi"
lane_ephemeral_storage = "12Gi"
# debug, info, warn or error.
log_level = "info"
# The control plane's NATS server (ADR 0021): the runner takes sessions from it and reports their
# status to it. Lanes keep running while it is unreachable. tls://, or nats:// to a Service in this
# cluster: the runner's token travels to it, so a remote runner needs tls://.
nats_url = "nats://rangelight-nats.rangelight-system.svc:4222"
# The runner's projected token for NATS (audience rangelight-nats), read again at every connect.
nats_token_file = "/var/run/secrets/rangelight/nats/token"
# The runner protocol's subject tokens: rl.<org>.runner.<runner_id>.desired and .status.
org = "default"
runner_id = "default"
# The GitHub App that pushes each lane's work branch upstream and opens its pull request (ADR 0011,
# ADR 0040 §3): secret://<name>#<key> references to its id and its private key. Empty: publishing is off.
github_app_id = ""
github_app_private_key = ""
# The GitHub API.
github_api_url = "https://api.github.com"
# The git mirror's image, by tag and digest: each publish is a Job running its publish.sh (the chart sets it).
publish_image = ""
# Where each git mirror repo's work branches are pushed: "<name>=<https URL> ..." (the chart sets it
# from gitMirror.repos).
upstreams = ""
