{{- /* The NetworkPolicies and the operator's scope assume this namespace. */ -}}
{{- if ne .Release.Namespace "rangelight-system" }}
{{- fail (printf "install into the namespace rangelight-system, not %q" .Release.Namespace) }}
{{- end }}
{{- /* The runner's ServiceAccount must be one no rangelight-system workload can mount (ADR 0046 amendment). */ -}}
{{- if and .Values.runner.enabled (eq .Values.runner.namespace .Release.Namespace) }}
{{- fail (printf "runner.namespace must not be %q: the runner runs in its own namespace" .Release.Namespace) }}
{{- end }}
{{- /* The Ingress routes to the api and the Workbench: it needs both. */ -}}
{{- if and .Values.ingress.enabled (not (and .Values.api.enabled .Values.web.enabled)) }}
{{- fail "ingress.enabled needs api.enabled and web.enabled: the Ingress routes to both" }}
{{- end }}
