---
# Zot for the dev environment (ADR 0040 §5), applied by `script/cluster.sh up`.
# ${SYSTEM_NS} and ${ZOT_IMAGE} are filled in from script/cluster.sh and deployments/dev/versions.env.
# Dev only: one replica, anonymous pull and push inside the cluster, no TLS.
apiVersion: "v1"
kind: "Namespace"
metadata:
  name: "${SYSTEM_NS}"
  labels:
    pod-security.kubernetes.io/enforce: "restricted"
    app.kubernetes.io/part-of: "rangelight"
    app.kubernetes.io/managed-by: "cluster.sh"
---
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "zot-config"
  namespace: "${SYSTEM_NS}"
  labels:
    app.kubernetes.io/name: "zot"
    app.kubernetes.io/component: "registry"
    app.kubernetes.io/part-of: "rangelight"
    app.kubernetes.io/managed-by: "cluster.sh"
data:
  config.json: |
    {
      "distSpecVersion": "1.1.1",
      "storage": { "rootDirectory": "/var/lib/registry" },
      "http": { "address": "0.0.0.0", "port": "5000" },
      "log": { "level": "info" }
    }
---
apiVersion: "v1"
kind: "PersistentVolumeClaim"
metadata:
  name: "zot-data"
  namespace: "${SYSTEM_NS}"
  labels:
    app.kubernetes.io/name: "zot"
    app.kubernetes.io/component: "registry"
    app.kubernetes.io/part-of: "rangelight"
    app.kubernetes.io/managed-by: "cluster.sh"
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: "10Gi"
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "zot"
  namespace: "${SYSTEM_NS}"
  labels:
    app.kubernetes.io/name: "zot"
    app.kubernetes.io/component: "registry"
    app.kubernetes.io/part-of: "rangelight"
    app.kubernetes.io/managed-by: "cluster.sh"
spec:
  replicas: 1
  strategy:
    type: "Recreate"
  selector:
    matchLabels:
      app.kubernetes.io/name: "zot"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "zot"
        app.kubernetes.io/component: "registry"
        app.kubernetes.io/part-of: "rangelight"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: "RuntimeDefault"
      containers:
        - name: "zot"
          image: "${ZOT_IMAGE}"
          args:
            - "serve"
            - "/etc/zot/config.json"
          ports:
            - name: "http"
              containerPort: 5000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          readinessProbe:
            httpGet:
              path: "/v2/"
              port: "http"
          livenessProbe:
            httpGet:
              path: "/v2/"
              port: "http"
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              memory: "512Mi"
          volumeMounts:
            - name: "config"
              mountPath: "/etc/zot"
              readOnly: true
            - name: "data"
              mountPath: "/var/lib/registry"
            - name: "tmp"
              mountPath: "/tmp"
      volumes:
        - name: "config"
          configMap:
            name: "zot-config"
        - name: "data"
          persistentVolumeClaim:
            claimName: "zot-data"
        - name: "tmp"
          emptyDir: {}
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "zot"
  namespace: "${SYSTEM_NS}"
  labels:
    app.kubernetes.io/name: "zot"
    app.kubernetes.io/component: "registry"
    app.kubernetes.io/part-of: "rangelight"
    app.kubernetes.io/managed-by: "cluster.sh"
spec:
  selector:
    app.kubernetes.io/name: "zot"
  ports:
    - name: "http"
      port: 5000
      targetPort: "http"
