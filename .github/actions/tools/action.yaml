---
# The check tools pinned in scripts/tools.env, installed by scripts/tools.sh exactly as on a laptop; the
# cache is reused until tools.env changes. scripts/check.sh puts them on PATH itself.
name: "tools"
description: "Install the pinned check tools (scripts/tools.env)"
runs:
  using: "composite"
  steps:
    - uses: "actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9"  # v6.1.0
      with:
        path: "~/.cache/rangelight/tools"
        key: "rl-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/tools.env') }}"
    - run: "scripts/tools.sh"
      shell: "bash"
