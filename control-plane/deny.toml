# cargo-deny: licences, advisories, bans and sources (ADR 0049 §3).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Apache-2.0 compatible only. Add a licence here by a reviewed change, never per crate.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Adapter crates stay out of rl-domain (ADR 0049 §2.1): only their owning crate depends on them.
deny = [
  { crate = "sqlx", wrappers = ["rl-store", "rl-testkit"] },
  { crate = "cedar-policy", wrappers = ["rl-policy", "rl-testkit"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
