# The relay's defaults (ADR 0049 §6). Override in /etc/rangelight/relay.toml or with
# RANGELIGHT_RELAY_<KEY>, for example RANGELIGHT_RELAY_RUNNER=prod-eu-1.

# `tracing` filter directives.
log = "info"
# The listener for /healthz: 200 once the relay has started (Postgres, NATS and the stream set up).
listen = "0.0.0.0:8080"
# The Postgres URL, as a secret reference: the mounted Secret file holds the whole URL.
database_url = "secret://postgres#url"
# NATS (ADR 0021): tls://, or nats:// to a Service in this cluster, since the relay's token travels to it.
nats_url = "nats://rangelight-nats.rangelight-system.svc.cluster.local:4222"
# The relay's projected token for NATS (audience rangelight-nats), read again at every connect.
nats_token_file = "/var/run/secrets/rangelight/nats/token"
# The org's NATS subject token (ADR 0021): subjects are rl.<org>.…
org = "default"
# The runner every session's desired state goes to, until admission places sessions (ADR 0018).
runner = "default"
# JetStream replicas of the desired-state stream: 1 in `lean`, 3 in `scale` (ADR 0021).
stream_replicas = 1
