{{- if .Values.nats.enabled }}
---
apiVersion: "networking.k8s.io/v1"
kind: "NetworkPolicy"
metadata:
  name: "rangelight-nats"
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "rangelight.labels" (dict "ctx" $ "name" "nats" "component" "messaging") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: "nats"
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  policyTypes:
    - "Ingress"
  ingress:
    # Rangelight's own pods in rangelight-system, on the client port only.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: "rangelight"
      ports:
        - protocol: "TCP"
          port: 4222
{{- end }}
