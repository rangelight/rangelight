# Nightly fuzzing (ADR 0049 §8). No targets exist yet; the job fails once targets exist and
# nothing runs them, so a fuzz target can't be added and silently never run.
name: fuzz

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find fuzz targets
        run: |
          if [[ -d control-plane/fuzz ]] || git grep -q -E '^func Fuzz[A-Z]' -- 'runner/**/*_test.go'; then
            echo "fuzz targets exist but this workflow does not run them yet" >&2
            exit 1
          fi
          echo "skipped: fuzz (no targets yet)"
