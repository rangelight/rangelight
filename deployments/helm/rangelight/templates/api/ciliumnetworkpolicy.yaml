{{- if and .Values.api.enabled (.Capabilities.APIVersions.Has "cilium.io/v2") }}
---
# With Cilium, the api reaches the API server (the cluster's token signing keys, for the NATS auth callout) by its
# identity, not by an address: added to templates/api/networkpolicy.yaml's rules.
apiVersion: "cilium.io/v2"
kind: "CiliumNetworkPolicy"
metadata:
  name: "rangelight-api-apiserver"
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "rangelight.labels" (dict "ctx" $ "name" "api" "component" "control-plane") | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "rangelight.selector" (dict "ctx" $ "name" "api") | nindent 6 }}
  egress:
    - toEntities:
        - "kube-apiserver"
      toPorts:
        - ports:
            - port: "443"
              protocol: "TCP"
            - port: "6443"
              protocol: "TCP"
{{- end }}
