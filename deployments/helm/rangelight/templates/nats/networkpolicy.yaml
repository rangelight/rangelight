{{- if .Values.nats.enabled }}
---
apiVersion: "networking.k8s.io/v1"
kind: "NetworkPolicy"
metadata:
  name: "rangelight-nats"
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "rangelight.labels" (dict "ctx" $ "name" "nats" "component" "messaging") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: "nats"
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  policyTypes:
    - "Ingress"
  ingress:
    # Only NATS's clients, on the client port: the api and the relay in rangelight-system, and the
    # runner in its own namespace (the runner protocol). Nothing else, the git mirror included. Each
    # signs in with its own identity (templates/nats/_auth.conf.tpl).
    - from:
        - podSelector:
            matchLabels:
              {{- include "rangelight.selector" (dict "ctx" $ "name" "api") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "rangelight.selector" (dict "ctx" $ "name" "relay") | nindent 14 }}
        {{- if .Values.runner.enabled }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.runner.namespace | quote }}
          podSelector:
            matchLabels:
              {{- include "rangelight.selector" (dict "ctx" $ "name" "runner") | nindent 14 }}
        {{- end }}
      ports:
        - protocol: "TCP"
          port: 4222
    {{- if .Values.runner.enabled }}
    # The lane agents, for the lane terminal (rl.<org>.pty.<session>.*): only the agent pod of a lane
    # namespace, on the client port only. Each signs in as its lane, which may use only its own
    # terminal's two subjects (ADR 0045 amendment).
    - from:
        - namespaceSelector:
            matchLabels:
              rangelight.dev/lane: "true"
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "agent"
              app.kubernetes.io/component: "lane"
              app.kubernetes.io/managed-by: "rangelight-runner"
      ports:
        - protocol: "TCP"
          port: 4222
    {{- end }}
{{- end }}
