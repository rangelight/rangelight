{{- if .Values.runner.enabled }}
---
# Only the git mirror may call the runner (/auth/git). Egress stays open: the runner needs the API
# server, whose address no NetworkPolicy can name portably, and the mirror.
apiVersion: "networking.k8s.io/v1"
kind: "NetworkPolicy"
metadata:
  name: "runner"
  namespace: {{ .Values.runner.namespace | quote }}
  labels:
    {{- include "rangelight.labels" (dict "ctx" $ "name" "runner" "component" "runner") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rangelight.selector" (dict "ctx" $ "name" "runner") | nindent 6 }}
  policyTypes:
    - "Ingress"
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "git-mirror"
      ports:
        - protocol: "TCP"
          port: 8080
{{- end }}
