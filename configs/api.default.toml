# The api's defaults (ADR 0049 §6). Override in /etc/rangelight/api.toml or with
# RANGELIGHT_API_<KEY>, for example RANGELIGHT_API_LINEAR_TEAM=RAN. `linear_team`, `public_url`,
# `oidc_issuer`, `repo` and `member` have no default.

# `tracing` filter directives.
log = "info"
# The Connect-RPC listener.
listen = "0.0.0.0:8080"
# The Postgres URL, as a secret reference: the mounted Secret file holds the whole URL.
database_url = "secret://postgres#url"
# NATS (ADR 0021): tls://, or nats:// to a Service in this cluster, since the api's token travels to it.
nats_url = "nats://rangelight-nats.rangelight-system.svc:4222"
# The api's projected token for NATS (audience rangelight-nats), read again at every connect.
nats_token_file = "/var/run/secrets/rangelight/nats/token"
# The org's NATS subject token (ADR 0021): subjects are rl.<org>.…
org = "default"
# The runner every session runs at, until admission places sessions (ADR 0018): the relay's `runner`.
runner = "default"
linear_url = "https://api.linear.app/graphql"
# The Linear API key, as a secret reference, read at each poll.
linear_api_key = "secret://linear#api-key"
# Sign-in (OIDC). `public_url` is where browsers reach the Workbench: https://<host>[:<port>].
# `oidc_issuer` is <public_url>/dex for the bundled Dex, or your own provider's issuer (https).
oidc_client_id = "rangelight-api"
# The api's client secret at the issuer, as a secret reference, read at each sign-in.
oidc_client_secret = "secret://rangelight-oidc#client-secret"
# The ID-token claim that names the member: the GitHub login through Dex. With your own provider,
# a claim the provider sets and keeps unique, never one users can edit.
oidc_member_claim = "preferred_username"
# Seconds between a WatchSession stream's checks that its login still lives; it ends when not.
login_recheck_seconds = 60
# JetStream replicas of the runners' status stream: 1 in `lean`, 3 in `scale` (ADR 0021).
stream_replicas = 1
# Where the team's sessions work, until repo onboarding maps teams to repos (ADR 0047): the git
# mirror's name for the repo (`repo`, no default) and its approved base branch.
base_ref = "main"
# That repo's upstream, https://github.com/<owner>/<repo>: a lane's pull request is kept (and
# attached to its ticket) only when it is one of this repo's. Empty: no pull request is kept.
upstream = ""
# The member the team's sessions work for: their login (the `oidc_member_claim`, the GitHub login
# through Dex), lowercased. Their lanes mount that member's Claude home (ADR 0046 amendment), and
# only that login may open a session's terminal. No default.
# `extra_ca_file`, unset by default: a PEM bundle of CA certificates the api's HTTPS (the issuer,
# Linear) trusts beside the platform's roots, for an issuer behind your own CA. A file that holds no
# certificate, or one that doesn't parse, stops the api at start.

# The api is NATS's auth callout (ADR 0021 amendment): it verifies each client's projected token and
# answers with a user JWT holding that identity's exact permissions.
[nats_auth]
# The callout issuer's nkey seed, which signs the user JWTs; its public key is auth_callout.issuer.
issuer_seed = "secret://rangelight-api-nats#issuer-seed"
# The api's own sign-in as the callout's auth user: an nkey seed, or a .creds file in operator mode.
auth_user = "secret://rangelight-api-nats#auth-user-seed"
# The accounts the user JWTs are for: RL (the control plane, the runners) and LANE (the lanes, which the
# server limits to one subscription and 128 KiB each). In operator mode, their public keys, and
# lane_issuer_seed names LANE's signing key.
account = "RL"
lane_account = "LANE"

# The token issuers clients sign in with: this cluster's, fetched with the api's own token over the
# cluster's CA. `control_plane`: the api and the relay run here. Each cluster has one runner.
[[nats_auth.issuers]]
url = "https://kubernetes.default.svc.cluster.local"
jwks_url = "https://kubernetes.default.svc/openid/v1/jwks"
jwks_token_file = "/var/run/secrets/rangelight/kubernetes/token"
jwks_ca_file = "/var/run/secrets/rangelight/kubernetes/ca.crt"
control_plane = true
runner = "default"
runner_service_account = "rangelight-runner:runner"
