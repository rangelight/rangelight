---
# A stand-in for Cilium's CiliumNetworkPolicy CRD, enough for the API server to serve the kind. The
# tests check the object the runner builds, not Cilium's schema.
apiVersion: "apiextensions.k8s.io/v1"
kind: "CustomResourceDefinition"
metadata:
  name: "ciliumnetworkpolicies.cilium.io"
spec:
  group: "cilium.io"
  scope: "Namespaced"
  names:
    kind: "CiliumNetworkPolicy"
    listKind: "CiliumNetworkPolicyList"
    plural: "ciliumnetworkpolicies"
    singular: "ciliumnetworkpolicy"
  versions:
    - name: "v2"
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: "object"
          x-kubernetes-preserve-unknown-fields: true
