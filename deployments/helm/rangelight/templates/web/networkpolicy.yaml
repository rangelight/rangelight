{{- if .Values.web.enabled }}
---
# Only the ingress controller (ingress.from) reaches the Workbench, on 8080. It calls nothing, DNS included: it only
# serves files.
apiVersion: "networking.k8s.io/v1"
kind: "NetworkPolicy"
metadata:
  name: "rangelight-web"
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "rangelight.labels" (dict "ctx" $ "name" "web" "component" "workbench") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rangelight.selector" (dict "ctx" $ "name" "web") | nindent 6 }}
  policyTypes:
    - "Ingress"
    - "Egress"
  {{- with include "rangelight.ingressPeer" . }}
  ingress:
    - from:
        {{- . | nindent 8 }}
      ports:
        - protocol: "TCP"
          port: 8080
  {{- end }}
{{- end }}
