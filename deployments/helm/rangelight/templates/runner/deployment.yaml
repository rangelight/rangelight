{{- if .Values.runner.enabled }}
---
{{- $app := .Values.githubApp.secretRef.name }}
{{- $upstreams := list -}}
{{- range .Values.gitMirror.repos }}{{ $upstreams = append $upstreams (printf "%s=%s" .name .upstream) }}{{ end }}
# The runner (ADR 0018): one replica, so no leader election. Its config is the defaults plus these
# RANGELIGHT_RUNNER_* variables (configs/runner.default.toml).
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "runner"
  namespace: {{ .Values.runner.namespace | quote }}
  labels:
    {{- include "rangelight.labels" (dict "ctx" $ "name" "runner" "component" "runner") | nindent 4 }}
spec:
  replicas: 1
  # Never two runners at once.
  strategy:
    type: "Recreate"
  selector:
    matchLabels:
      {{- include "rangelight.selector" (dict "ctx" $ "name" "runner") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rangelight.labels" (dict "ctx" $ "name" "runner" "component" "runner") | nindent 8 }}
    spec:
      serviceAccountName: "runner"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: "RuntimeDefault"
      containers:
        - name: "runner"
          image: {{ required "runner.image is required" .Values.runner.image | quote }}
          env:
            - name: "RANGELIGHT_RUNNER_NAMESPACE"
              valueFrom:
                fieldRef:
                  fieldPath: "metadata.namespace"
            - name: "RANGELIGHT_RUNNER_AGENT_IMAGE"
              value: {{ required "runner.agentImage is required" .Values.runner.agentImage | quote }}
            - name: "RANGELIGHT_RUNNER_MIRROR_URL"
              # Empty without the mirror: lanes then fail, and a deleted Session has no mirror repo to remove.
              value: {{ ternary (printf "http://git-mirror.%s.svc.cluster.local:8080" .Release.Namespace) "" .Values.gitMirror.enabled | quote }}
            - name: "RANGELIGHT_RUNNER_DNS_NAMESPACE"
              value: {{ .Values.clusterDns.namespace | quote }}
            - name: "RANGELIGHT_RUNNER_DNS_POD_LABEL"
              value: {{ .Values.clusterDns.podLabel | quote }}
            - name: "RANGELIGHT_RUNNER_WORKERS"
              value: {{ .Values.runner.workers | quote }}
            # The runner protocol (ADR 0021); lanes keep running while NATS is unreachable.
            - name: "RANGELIGHT_RUNNER_NATS_URL"
              value: {{ include "rangelight.natsUrl" . | quote }}
            {{- if $app }}
            # Publishing (githubApp): the App's two keys as files, and where each repo's work branches go.
            - name: "RANGELIGHT_RUNNER_GITHUB_APP_ID"
              value: {{ printf "secret://%s#app-id" $app | quote }}
            - name: "RANGELIGHT_RUNNER_GITHUB_APP_PRIVATE_KEY"
              value: {{ printf "secret://%s#private-key" $app | quote }}
            - name: "RANGELIGHT_RUNNER_UPSTREAMS"
              value: {{ join " " $upstreams | quote }}
            # The publish Job runs publish.sh from the git mirror's image, which has git.
            - name: "RANGELIGHT_RUNNER_PUBLISH_IMAGE"
              value: {{ required "githubApp needs gitMirror.image" .Values.gitMirror.image | quote }}
            {{- end }}
          ports:
            - name: "http"
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: "/healthz"
              port: "http"
          livenessProbe:
            httpGet:
              path: "/healthz"
              port: "http"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          {{- include "rangelight.resources" .Values.runner.resources | nindent 10 }}
          volumeMounts:
            # Each profile read is a depth-1 clone here, removed after the read.
            - name: "tmp"
              mountPath: "/tmp"
            # The runner's own identity at the git mirror (read-only there): mirror_token_file.
            - name: "git-mirror-token"
              mountPath: "/var/run/secrets/rangelight/git-mirror"
              readOnly: true
            # Its identity at NATS (nats_token_file): the api's auth callout maps it to this runner.
            - name: "nats-token"
              mountPath: "/var/run/secrets/rangelight/nats"
              readOnly: true
            {{- if $app }}
            - name: "secrets"
              mountPath: "/var/run/rangelight/secrets"
              readOnly: true
            {{- end }}
      volumes:
        - name: "tmp"
          emptyDir:
            sizeLimit: {{ .Values.runner.tmpSize | quote }}
        - name: "git-mirror-token"
          projected:
            sources:
              - serviceAccountToken:
                  audience: "rangelight-git-mirror"
                  expirationSeconds: 600
                  path: "token"
        {{- include "rangelight.natsTokenVolume" . | nindent 8 }}
        {{- if $app }}
        {{- include "rangelight.secretsVolume" (list (printf "%s#app-id" $app) (printf "%s#private-key" $app)) | nindent 8 }}
        {{- end }}
{{- end }}
