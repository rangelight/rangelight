# cargo-deny: licences, advisories, bans and sources (ADR 0049 §3).

[graph]
all-features = true
# The targets we build (images, CI, developer machines); wasm32-only crates don't ship.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"
# Each ignore names why the advisory can't reach Rangelight; drop it when the fix lands upstream.
ignore = [
  # rsa 0.9 (no fixed release), through openidconnect: rl-auth only verifies ID-token signatures
  # with the provider's public keys. The Marvin attack needs private-key operations, which
  # Rangelight never does with rsa.
  { id = "RUSTSEC-2023-0071", reason = "rsa only verifies signatures here (rl-auth); no private-key use" },
]

[licenses]
version = 2
# Apache-2.0 compatible only. Add a licence here by a reviewed change, never per crate.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Workspace path dependencies (publish = false) carry no version.
allow-wildcard-paths = true
# Duplicates our dependencies bring that no version choice of ours removes. Each names who still
# needs the older one; drop the entry when they move. Any other duplicate fails.
skip = [
  { crate = "sha2@0.10", reason = "sqlx-core 0.9 (sqlx-postgres uses 0.11)" },
  { crate = "digest@0.10", reason = "sha2 0.10, for sqlx-core" },
  { crate = "block-buffer@0.10", reason = "sha2 0.10, for sqlx-core" },
  { crate = "crypto-common@0.1", reason = "sha2 0.10, for sqlx-core" },
  { crate = "cpufeatures@0.2", reason = "sha2 0.10, for sqlx-core" },
  { crate = "base64@0.22", reason = "async-nats, buffa, connectrpc, openidconnect, rl-auth, sqlx (reqwest uses 0.23)" },
  { crate = "getrandom@0.2", reason = "ring 0.17" },
  { crate = "syn@2", reason = "sqlx, buffa and connectrpc codegen, tracing-attributes" },
  { crate = "hashbrown@0.15", reason = "buffa 0.9" },
  { crate = "foldhash@0.1", reason = "buffa 0.9" },
  { crate = "hashbrown@0.16", reason = "sqlx-core 0.9" },
  { crate = "thiserror@1", reason = "openidconnect 4 and oauth2 5" },
  { crate = "thiserror-impl@1", reason = "thiserror 1, for openidconnect" },
  { crate = "hmac@0.12", reason = "openidconnect 4" },
  { crate = "rand@0.8", reason = "openidconnect 4 and rsa 0.9" },
  { crate = "rand_core@0.6", reason = "rand 0.8, for openidconnect" },
  { crate = "signature@2", reason = "rsa 0.9, for openidconnect" },
  { crate = "const-oid@0.9", reason = "rsa 0.9 (der 0.7), for openidconnect" },
  { crate = "der@0.7", reason = "rsa 0.9, for openidconnect" },
  { crate = "pem-rfc7468@0.7", reason = "der 0.7, for openidconnect" },
  { crate = "pkcs8@0.10", reason = "rsa 0.9, for openidconnect" },
  { crate = "spki@0.7", reason = "rsa 0.9, for openidconnect" },
  { crate = "ed25519-dalek@2", reason = "nkeys 0.4, for async-nats and the NATS auth callout (openidconnect uses 3)" },
  { crate = "ed25519@2", reason = "ed25519-dalek 2, for nkeys" },
  { crate = "curve25519-dalek@4", reason = "ed25519-dalek 2, for nkeys" },
  { crate = "rand@0.9", reason = "tungstenite 0.29, for axum's ws (the lane terminal)" },
  { crate = "rand_chacha@0.9", reason = "rand 0.9, for tungstenite" },
  { crate = "rand_core@0.9", reason = "rand 0.9, for tungstenite" },
  { crate = "getrandom@0.3", reason = "rand_core 0.9, for tungstenite" },
]
# Adapter crates stay out of rl-domain (ADR 0049 §2.1): only their owning crate depends on them.
# I/O crates list every crate allowed to depend on them directly, so rl-domain (sync, no I/O)
# can never take one on. A new direct user is a reviewed edit here.
deny = [
  { crate = "sqlx", wrappers = ["rl-store", "rl-testkit"] },
  { crate = "cedar-policy", wrappers = ["rl-policy", "rl-testkit"] },
  { crate = "reqwest", wrappers = ["api", "rl-auth", "rl-testkit", "rl-tickets-linear"] },
  { crate = "async-nats", wrappers = ["api", "relay", "rl-nats", "rl-testkit"] },
  { crate = "hyper", wrappers = ["api", "axum", "connectrpc", "hyper-rustls", "hyper-util", "reqwest"] },
  { crate = "tokio", wrappers = [
    "api", "relay", "rl-app", "rl-auth", "rl-nats", "rl-store", "rl-testkit", "rl-tickets-linear",
    "async-nats", "axum", "connectrpc", "h2", "hyper", "hyper-rustls", "hyper-util", "reqwest", "sqlx-core",
    "sqlx-macros-core", "tokio-rustls", "tokio-stream", "tokio-tungstenite", "tokio-util", "tower", "tryhard",
  ] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
