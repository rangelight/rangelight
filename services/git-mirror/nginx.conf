# The git mirror's front (ADR 0011): smart HTTP only, every request authenticated by the runner's
# /auth/git (RAN-19), which answers 2xx with the caller's identity in X-Remote-User
# ("session-<id>" or "runner"), or 401/403. backend.sh and the hooks re-check that identity
# and pick the one repo the caller may use (see README.md).
# Runs unprivileged on a read-only root: everything writable is under /tmp.
#
# Two servers, because nginx applies limit_req and limit_conn once per request: the outer one limits
# per client address before auth (so a flood never reaches /auth/git) and authenticates; the inner
# one, on a pod-local socket, is a new request and limits per identity.
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
  worker_connections 512;
}

http {
  access_log /dev/stdout;
  client_body_temp_path /tmp/nginx-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;
  server_tokens off;
  default_type text/plain;
  # One push; the session repo as a whole is capped by the pre-receive hook.
  client_max_body_size 100m;
  # A slow client can't hold a connection open by trickling its request.
  client_header_timeout 15s;
  client_body_timeout 15s;
  # The pod's own nameserver, written at start by the image's CMD (no DNS service name assumed).
  # The runner is resolved per request, so the mirror starts, and refuses everything, without it.
  include /tmp/resolver.conf;

  limit_req_zone $binary_remote_addr zone=ip_req:10m rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=ip_conn:10m;
  # Keyed on the identity the outer server set; fcgiwrap has 16 workers, one identity gets 4.
  limit_req_zone $http_x_rangelight_user zone=git_req:10m rate=10r/s;
  limit_conn_zone $http_x_rangelight_user zone=git_conn:10m;
  limit_req_status 429;
  limit_conn_status 429;

  server {
    listen 8080;
    # $rl_runner, the runner's host:port, written at start by the image's CMD from RANGELIGHT_RUNNER_NAMESPACE.
    include /tmp/runner.conf;
    limit_req zone=ip_req burst=50 nodelay;
    limit_conn ip_conn 8;

    location = /healthz {
      access_log off;
      return 200 "ok\n";
    }

    location = /_auth {
      internal;
      set $rl_auth "http://$rl_runner/auth/git";
      proxy_pass $rl_auth;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header X-Original-Method $request_method;
      # Never forward a client's own claim of who it is.
      proxy_set_header X-Remote-User "";
    }

    location ~ "^/(session/|sessions/)?[A-Za-z0-9][A-Za-z0-9._-]*\.git/(info/refs|git-upload-pack|git-receive-pack)$" {
      auth_request /_auth;
      auth_request_set $rl_user $upstream_http_x_remote_user;
      # git's HTTP client sends credentials only after a 401 names a scheme (the runner's own
      # client sends them up front, so only the agent's git CLI needs this).
      error_page 401 = @rl_sign_in;
      # Always set, so a client's own X-Rangelight-User never reaches the inner server.
      proxy_set_header X-Rangelight-User $rl_user;
      proxy_pass http://unix:/tmp/nginx-inner.sock;
      proxy_buffering off;
      proxy_read_timeout 600s;
    }

    location @rl_sign_in {
      add_header WWW-Authenticate 'Basic realm="rangelight"' always;
      return 401 "rangelight: no valid identity\n";
    }

    location / {
      return 404 "rangelight: not found\n";
    }
  }

  # Reachable only through the socket in nginx's own /tmp, which no other container mounts.
  server {
    listen unix:/tmp/nginx-inner.sock;
    include /tmp/runner.conf;

    location / {
      limit_req zone=git_req burst=50 nodelay;
      limit_conn git_conn 4;
      fastcgi_pass unix:/tmp/fcgiwrap/fcgiwrap.sock;
      fastcgi_buffering off;
      fastcgi_read_timeout 600s;
      # Only these reach backend.sh, plus the request headers as HTTP_*.
      fastcgi_param SCRIPT_FILENAME /opt/git-mirror/backend.sh;
      fastcgi_param GATEWAY_INTERFACE CGI/1.1;
      fastcgi_param REQUEST_METHOD $request_method;
      fastcgi_param PATH_INFO $uri;
      fastcgi_param QUERY_STRING $query_string;
      fastcgi_param CONTENT_TYPE $content_type;
      fastcgi_param CONTENT_LENGTH $content_length;
      fastcgi_param REMOTE_USER $http_x_rangelight_user;
      fastcgi_param GIT_PROJECT_ROOT /srv/git;
      fastcgi_param GIT_HTTP_EXPORT_ALL 1;
      # post-receive tells the runner of each work-branch push, with the pushing session's own token.
      fastcgi_param RANGELIGHT_PUSHED_URL "http://$rl_runner/git/pushed";
      # No checkpoint receiver yet: post-receive sends nothing until RANGELIGHT_EVENTS_URL is set here.
    }
  }
}
