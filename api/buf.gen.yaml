---
# Generated code is committed and never edited by hand (ADR 0049 §2.3).
# protoc-gen-go is pinned by the root go.mod (its `tool` directive), so the Go code always matches
# the protobuf runtime the services compile against. Run from api/: `buf generate`.
version: "v2"
clean: true
plugins:
  - local: ["go", "-C", "..", "tool", "protoc-gen-go"]
    out: "../shared/go/gen"
    opt:
      - "paths=source_relative"
