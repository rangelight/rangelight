---
# One YAML style (ADR 0049, amendment "layout and style from day one"). Run by `scripts/check.sh yaml`.
extends: "default"

rules:
  document-start:
    present: true
  quoted-strings:
    quote-type: "double"
    required: true
  truthy:
    allowed-values: ["true", "false"]
    # GitHub Actions' `on:` is a key, not a boolean.
    check-keys: false
  line-length:
    max: 160
# Helm templates are YAML only once rendered: `scripts/check.sh deploy` lints what they render.
# Chart.lock is written by `helm dependency update`; pnpm-lock.yaml by pnpm.
ignore: |
  deployments/helm/rangelight/templates/
  deployments/helm/rangelight/Chart.lock
  pnpm-lock.yaml
