{{- if .Values.runner.enabled }}
---
# The git mirror's nginx asks http://runner.<runner namespace>.svc.cluster.local:8080/auth/git (RAN-17).
apiVersion: "v1"
kind: "Service"
metadata:
  name: "runner"
  namespace: {{ .Values.runner.namespace | quote }}
  labels:
    {{- include "rangelight.labels" (dict "ctx" $ "name" "runner" "component" "runner") | nindent 4 }}
spec:
  selector:
    {{- include "rangelight.selector" (dict "ctx" $ "name" "runner") | nindent 4 }}
  ports:
    - name: "http"
      port: 8080
      targetPort: "http"
{{- end }}
