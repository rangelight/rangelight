---
# The dev environment's values for deployments/helm/rangelight, used by `scripts/cluster.sh up`.
# The images come from versions.env: gitMirror.image, runner.image and runner.agentImage.
gitMirror:
  enabled: true
  repos:
    - name: "opentelemetry-demo"
      upstream: "https://github.com/rangelight/opentelemetry-demo.git"
runner:
  enabled: true
