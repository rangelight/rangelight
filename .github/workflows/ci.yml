# One job per part of script/check.sh, path-filtered on pull requests; everything runs on main.
# Each job runs only `script/check.sh <part>`, exactly as a developer does (ADR 0049, ADR 0050 §2).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      spec: ${{ github.event_name != 'pull_request' || steps.filter.outputs.spec == 'true' }}
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      go: ${{ github.event_name != 'pull_request' || steps.filter.outputs.go == 'true' }}
      ts: ${{ github.event_name != 'pull_request' || steps.filter.outputs.ts == 'true' }}
      deploy: ${{ github.event_name != 'pull_request' || steps.filter.outputs.deploy == 'true' }}
      hooks: ${{ github.event_name != 'pull_request' || steps.filter.outputs.hooks == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # A change to CI or to the checks themselves runs every part.
          filters: |
            shared: &shared
              - .github/workflows/ci.yml
              - script/check.sh
            spec:
              - *shared
              - spec/**
            rust:
              - *shared
              - control-plane/**
            go:
              - *shared
              - runner/**
            ts:
              - *shared
              - agent/**
              - web/**
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - tsconfig.base.json
              - eslint.config.js
              - .prettierrc
              - .nvmrc
            deploy:
              - *shared
              - script/**
              - charts/**
              - deploy/**
              - build/**
              - git-mirror/**
              - '**/*.sh'
            hooks:
              - *shared
              - git-mirror/**

  size:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: script/check.sh size

  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: script/check.sh rules

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum-verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" gitleaks
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - run: script/check.sh secrets

  scrub:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RANGELIGHT_SCRUB_PATTERN: ${{ secrets.SCRUB_PATTERN }}
      # Fork PRs get no secrets, so only they may skip; everywhere else a missing pattern fails.
      RANGELIGHT_SCRUB_REQUIRED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: script/check.sh scrub

  spec:
    needs: changes
    if: needs.changes.outputs.spec == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: hashFiles('spec/**') != ''
        uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          setup_only: true
      - run: script/check.sh spec

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: hashFiles('control-plane/**/*.rs') != ''
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: control-plane
      - if: hashFiles('control-plane/**/*.rs') != ''
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-nextest,cargo-deny,cargo-machete
      - run: script/check.sh rust

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner's preinstalled Go fetches the toolchain pinned in runner/go.mod.
      - run: script/check.sh go

  ts:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: hashFiles('pnpm-lock.yaml') != ''
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: hashFiles('pnpm-lock.yaml') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: script/check.sh ts

  deploy:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: hashFiles('charts/rangelight/Chart.yaml') != ''
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0 && echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
      - run: script/check.sh deploy

  hooks:
    needs: changes
    if: needs.changes.outputs.hooks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: script/check.sh hooks

  # The one required check: every part passed, or was skipped because its paths didn't change.
  gate:
    if: always()
    needs: [changes, size, rules, secrets, scrub, spec, rust, go, ts, deploy, hooks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: ${RESULTS}"
          for result in ${RESULTS}; do
            case "${result}" in success | skipped) ;; *) exit 1 ;; esac
          done
