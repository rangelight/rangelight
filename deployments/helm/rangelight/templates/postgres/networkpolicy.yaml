{{- if .Values.postgres.enabled }}
---
apiVersion: "networking.k8s.io/v1"
kind: "NetworkPolicy"
metadata:
  name: "rangelight-pg"
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "rangelight.labels" (dict "ctx" $ "name" "postgres" "component" "database") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: "rangelight-pg"
  policyTypes:
    - "Ingress"
  ingress:
    # Rangelight's own pods in rangelight-system.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: "rangelight"
      ports:
        - protocol: "TCP"
          port: 5432
    # The operator, to its instances: Postgres and the instance manager's status endpoint.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: "cloudnative-pg"
              app.kubernetes.io/instance: {{ .Release.Name | quote }}
      ports:
        - protocol: "TCP"
          port: 5432
        - protocol: "TCP"
          port: 8000
{{- end }}
