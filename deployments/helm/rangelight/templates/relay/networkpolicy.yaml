{{- if .Values.relay.enabled }}
---
# Nothing calls the relay. It calls out to the cluster's DNS, Postgres and NATS only.
apiVersion: "networking.k8s.io/v1"
kind: "NetworkPolicy"
metadata:
  name: "rangelight-relay"
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "rangelight.labels" (dict "ctx" $ "name" "relay" "component" "control-plane") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rangelight.selector" (dict "ctx" $ "name" "relay") | nindent 6 }}
  policyTypes:
    - "Ingress"
    - "Egress"
  egress:
    {{- include "rangelight.dnsEgress" . | nindent 4 }}
    {{- include "rangelight.storeEgress" . | nindent 4 }}
{{- end }}
