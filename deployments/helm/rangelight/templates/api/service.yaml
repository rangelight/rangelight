{{- if .Values.api.enabled }}
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "rangelight-api"
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "rangelight.labels" (dict "ctx" $ "name" "api" "component" "control-plane") | nindent 4 }}
spec:
  selector:
    {{- include "rangelight.selector" (dict "ctx" $ "name" "api") | nindent 4 }}
  ports:
    - name: "http"
      port: 8080
      targetPort: "http"
{{- end }}
