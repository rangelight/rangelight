{{- if .Values.dex.enabled }}
---
# Dex serves only whatever routes <publicUrl>/dex to it (ingress.from), on 5556. It calls out only to the
# cluster's DNS and to HTTPS outside the cluster (GitHub): never to a pod or Service inside it.
apiVersion: "networking.k8s.io/v1"
kind: "NetworkPolicy"
metadata:
  name: "rangelight-dex"
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "rangelight.labels" (dict "ctx" $ "name" "dex" "component" "identity") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: "dex"
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  policyTypes:
    - "Ingress"
    - "Egress"
  {{- with include "rangelight.ingressPeer" . }}
  ingress:
    - from:
        {{- . | nindent 8 }}
      ports:
        - protocol: "TCP"
          port: 5556
  {{- end }}
  egress:
    {{- include "rangelight.dnsEgress" . | nindent 4 }}
    {{- include "rangelight.httpsEgress" . | nindent 4 }}
{{- end }}
