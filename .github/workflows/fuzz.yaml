---
# Nightly fuzzing (ADR 0049 §8): every Go fuzz target, through scripts/fuzz.sh. The job fails when fuzz
# targets exist that nothing runs, so a target can't be added and silently never run.
name: "fuzz"

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: "read"

jobs:
  fuzz:
    runs-on: "ubuntu-24.04"
    timeout-minutes: 60
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          persist-credentials: false
      # The runner's preinstalled Go fetches the toolchain pinned in go.mod.
      - run: "scripts/fuzz.sh go"
      # cargo-fuzz targets (fuzz/) have no runner here yet: fail rather than skip them silently.
      - name: "No unrun fuzz targets"
        run: |
          if [[ -d fuzz ]]; then
            echo "fuzz/ exists but this workflow does not run cargo-fuzz yet" >&2
            exit 1
          fi
