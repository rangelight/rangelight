<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How Rangelight works</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Rangelight light tokens (Workbench design tokens, ADR 0049 §5.1). */
  :root {
    --paper: #f4f5f7; --ink: #0f1217; --muted: #4d5560; --soft: #6b7380;

  html, body { margin: 0; background: var(--paper); }
  body { padding: 0; }
  svg { display: block; width: 1280px; height: 784px; text-rendering: geometricPrecision; }
  .sans { font-family: 'Geist', system-ui, sans-serif; }
  .mono { font-family: 'Geist Mono', ui-monospace, monospace; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 1280 784" role="img" aria-labelledby="how-it-works-title how-it-works-desc">
  <title id="how-it-works-title">How Rangelight works</title>
  <desc id="how-it-works-desc">A labelled Linear ticket reaches the Rangelight api, which records it in Postgres and publishes it over NATS; the runner creates an isolated lane where Claude Code works the ticket, streams events to the Workbench, pushes only its own refs to the git mirror, and the api opens the pull request on GitHub.</desc>

    <marker id="hiw-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4d5560"/></marker>
    <marker id="hiw-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#4d5560"/></marker>
    <marker id="hiw-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e6b8a"/></marker>
  </defs>

  <rect x="0" y="40" width="1280" height="784" fill="#f4f5f7"/>

  <!-- ── Zones ─────────────────────────────────────────────── -->
  <rect x="32" y="72" width="208" height="592" rx="8" fill="rgba(15,18,23,0.02)" stroke="rgba(15,18,23,0.14)" stroke-width="0.5"/>
  <rect x="48" y="66" width="76" height="12" rx="2" fill="#f4f5f7"/>
  <text x="52" y="75" class="mono" fill="#6b7380" font-size="8" letter-spacing="0.14em">YOUR TOOLS</text>

  <rect x="272" y="72" width="656" height="592" rx="8" fill="rgba(15,18,23,0.02)" stroke="rgba(15,18,23,0.14)" stroke-width="0.5"/>
  <rect x="288" y="66" width="192" height="12" rx="2" fill="#f4f5f7"/>
  <text x="292" y="75" class="mono" fill="#6b7380" font-size="8" letter-spacing="0.14em">RANGELIGHT-SYSTEM · ONE HELM CHART</text>

  <rect x="960" y="244" width="288" height="212" rx="8" fill="rgba(61,78,194,0.03)" stroke="rgba(61,78,194,0.55)" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="976" y="238" width="196" height="12" rx="2" fill="#f4f5f7"/>
  <text x="980" y="247" class="mono" fill="#3d4ec2" font-size="8" letter-spacing="0.14em">LANE · rl-&lt;ticket&gt; · ONE PER TICKET</text>

  <!-- ── Connectors (drawn before nodes) ───────────────────── -->
  <!-- 1 Linear → api -->
  <path d="M216,144 H312" fill="none" stroke="#4d5560" stroke-width="1" marker-end="url(#hiw-arrow)"/>
  <rect x="240" y="124" width="44" height="12" rx="2" fill="#f4f5f7"/>
  <text x="262" y="133" class="mono" fill="#4d5560" font-size="8" text-anchor="middle" letter-spacing="0.06em">LABEL</text>

  <!-- 2 api → Postgres -->
  <path d="M472,144 H512" fill="none" stroke="#4d5560" stroke-width="1" marker-end="url(#hiw-arrow)"/>
  <rect x="474" y="124" width="36" height="12" rx="2" fill="#f4f5f7"/>
  <text x="492" y="133" class="mono" fill="#4d5560" font-size="8" text-anchor="middle" letter-spacing="0.06em">1 TXN</text>

  <!-- 3 api ⇄ NATS -->
  <path d="M432,176 V248 Q432,256 440,256 H568 Q576,256 576,264 V336" fill="none" stroke="#4d5560" stroke-width="1" marker-start="url(#hiw-arrow-start)" marker-end="url(#hiw-arrow)"/>
  <rect x="466" y="236" width="76" height="12" rx="2" fill="#f4f5f7"/>
  <text x="504" y="245" class="mono" fill="#4d5560" font-size="8" text-anchor="middle" letter-spacing="0.06em">OUTBOX · LIVE</text>

  <!-- 4 api → Workbench -->
  <path d="M372,176 V336" fill="none" stroke="#4d5560" stroke-width="1" marker-end="url(#hiw-arrow)"/>
  <rect x="320" y="250" width="44" height="12" rx="2" fill="#f4f5f7"/>
  <text x="362" y="259" class="mono" fill="#4d5560" font-size="8" text-anchor="end" letter-spacing="0.06em">STREAM</text>

  <rect x="226" y="348" width="76" height="12" rx="2" fill="#f4f5f7"/>
  <text x="264" y="357" class="mono" fill="#4d5560" font-size="8" text-anchor="middle" letter-spacing="0.06em">WATCH · STEER</text>

  <rect x="680" y="348" width="48" height="12" rx="2" fill="#f4f5f7"/>
  <text x="704" y="357" class="mono" fill="#4d5560" font-size="8" text-anchor="middle" letter-spacing="0.06em">SESSION</text>

  <rect x="914" y="348" width="52" height="12" rx="2" fill="#f4f5f7"/>
  <text x="940" y="357" class="mono" fill="#4d5560" font-size="8" text-anchor="middle" letter-spacing="0.06em">CREATES</text>

  <path d="M1040,304 V288 Q1040,280 1032,280 H616 Q608,280 608,288 V336" fill="none" stroke="#4d5560" stroke-width="1" marker-start="url(#hiw-arrow-start)" marker-end="url(#hiw-arrow)"/>

  <text x="808" y="269" class="mono" fill="#4d5560" font-size="8" text-anchor="middle" letter-spacing="0.06em">EVENTS · TERMINAL</text>

  <rect x="912" y="572" width="80" height="12" rx="2" fill="#f4f5f7"/>
  <text x="952" y="581" class="mono" fill="#4d5560" font-size="8" text-anchor="middle" letter-spacing="0.06em">OWN REFS ONLY</text>

  <!-- 10 GitHub → git mirror (scheduled fetch) -->
  <path d="M216,608 H736" fill="none" stroke="#2e6b8a" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#hiw-arrow-link)"/>
  <rect x="454" y="588" width="44" height="12" rx="2" fill="#f4f5f7"/>
  <text x="476" y="597" class="mono" fill="#2e6b8a" font-size="8" text-anchor="middle" letter-spacing="0.06em">FETCH</text>

  <text x="1142" y="505" class="mono" fill="#2e6b8a" font-size="8" text-anchor="end" letter-spacing="0.06em">/login · DIRECT</text>

  <rect x="56" y="112" width="160" height="64" rx="6" fill="rgba(15,18,23,0.03)" stroke="rgba(15,18,23,0.32)" stroke-width="1"/>

  <rect x="56" y="336" width="160" height="64" rx="6" fill="#f4f5f7"/>

  <text x="80" y="351" class="mono" fill="#6b7380" font-size="7" text-anchor="middle" letter-spacing="0.08em">USER</text>
  <text x="136" y="372" class="sans" fill="#0f1217" font-size="13" font-weight="600" text-anchor="middle">You</text>

  <rect x="56" y="560" width="160" height="64" rx="6" fill="rgba(15,18,23,0.03)" stroke="rgba(15,18,23,0.32)" stroke-width="1"/>

  <text x="78" y="575" class="mono" fill="#6b7380" font-size="7" text-anchor="middle" letter-spacing="0.08em">EXT</text>
  <text x="136" y="596" class="sans" fill="#0f1217" font-size="13" font-weight="600" text-anchor="middle">GitHub</text>
  <text x="136" y="612" class="mono" fill="#4d5560" font-size="9" text-anchor="middle">your repo · PRs</text>

  <text x="392" y="148" class="sans" fill="#0f1217" font-size="13" font-weight="600" text-anchor="middle">api + relay</text>
  <text x="392" y="164" class="mono" fill="#4d5560" font-size="9" text-anchor="middle">control plane</text>

  <!-- Store: Postgres -->
  <rect x="512" y="112" width="160" height="64" rx="6" fill="#f4f5f7"/>
  <rect x="512" y="112" width="160" height="64" rx="6" fill="rgba(15,18,23,0.05)" stroke="#4d5560" stroke-width="1"/>
  <rect x="520" y="118" width="36" height="12" rx="2" fill="none" stroke="rgba(15,18,23,0.30)" stroke-width="0.5"/>
  <text x="538" y="127" class="mono" fill="#4d5560" font-size="7" text-anchor="middle" letter-spacing="0.08em">STORE</text>
  <text x="592" y="148" class="sans" fill="#0f1217" font-size="13" font-weight="600" text-anchor="middle">Postgres</text>
  <text x="592" y="164" class="mono" fill="#4d5560" font-size="9" text-anchor="middle">state · events · outbox</text>

  <!-- Service: Workbench -->
  <rect x="312" y="336" width="160" height="64" rx="6" fill="#f4f5f7"/>
  <rect x="312" y="336" width="160" height="64" rx="6" fill="#ffffff" stroke="#0f1217" stroke-width="1"/>
  <rect x="320" y="342" width="24" height="12" rx="2" fill="none" stroke="rgba(15,18,23,0.30)" stroke-width="0.5"/>
  <text x="332" y="351" class="mono" fill="#4d5560" font-size="7" text-anchor="middle" letter-spacing="0.08em">TS</text>
  <text x="392" y="372" class="sans" fill="#0f1217" font-size="13" font-weight="600" text-anchor="middle">Workbench</text>
  <text x="392" y="388" class="mono" fill="#4d5560" font-size="9" text-anchor="middle">GitHub sign-in · Dex</text>

  <!-- Store: NATS -->
  <rect x="512" y="336" width="160" height="64" rx="6" fill="#f4f5f7"/>
  <rect x="512" y="336" width="160" height="64" rx="6" fill="rgba(15,18,23,0.05)" stroke="#4d5560" stroke-width="1"/>
  <rect x="520" y="342" width="28" height="12" rx="2" fill="none" stroke="rgba(15,18,23,0.30)" stroke-width="0.5"/>

  <text x="592" y="372" class="sans" fill="#0f1217" font-size="13" font-weight="600" text-anchor="middle">NATS JetStream</text>
