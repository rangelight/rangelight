// The session API, v1alpha1: what the api serves over Connect-RPC (ADR 0033), and the payload of
// the session event log (ADR 0029).
// Maturity: v1alpha1 may break, with a changelog entry in api/README.md (ADR 0027).
// ADRs: 0021, 0029, 0031, 0033.
syntax = "proto3";

package rangelight.session.v1alpha1;

import "google/protobuf/timestamp.proto";
import "rangelight/runner/v1alpha1/runner.proto";

option go_package = "github.com/rangelight/rangelight/shared/go/gen/rangelight/session/v1alpha1;sessionv1alpha1";

// Sessions, as the Workbench reads them.
service SessionService {
  // The newest sessions first, at most 1000.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  // One session. NOT_FOUND when there's none with this id.
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  // A session's events as they commit, from the next one on. Fed from NATS fan-out, never by
  // polling Postgres. Receivers dedupe on Event.id. Ends with ABORTED when events went missing
  // (seq gap): reread the session and watch again.
  rpc WatchSession(WatchSessionRequest) returns (stream WatchSessionResponse);
  // Every session, live: one snapshot (what ListSessions returns), then each committed event of
  // any session as a change, new sessions included. The api subscribes before it reads the
  // snapshot and checks every change against each session's generation at that instant (a session
  // it didn't hold starts at 0): at or below is dropped, the next is sent, a gap (a lost event, or a
  // viewer that fell too far behind) ends the stream with ABORTED. Watch again for a fresh snapshot.
  rpc WatchSessions(WatchSessionsRequest) returns (stream WatchSessionsResponse);
}

message Session {
  string id = 1; // UUIDv7
  string tracker = 2; // "linear"
  string ticket_id = 3; // the tracker's id
  string ticket_key = 4; // e.g. "RAN-34"
  string title = 5;
  string namespace = 6; // rl-<ticket key>
  rangelight.runner.v1alpha1.DesiredState state = 7;
  uint64 generation = 8; // the seq of the session's last event
  rangelight.runner.v1alpha1.Phase phase = 9; // as its runner last reported it; unspecified before the first report
  string repo = 10; // the git mirror repo it works in
  google.protobuf.Timestamp created_at = 11;
  string ticket_url = 12; // the ticket in its tracker, https; empty for sessions from before it was recorded
  string pull_request_url = 13; // the lane's PR on GitHub; empty until the runner reports one
  string question = 14; // waiting for you: the lane's open ask; empty when it isn't waiting
}

message ListSessionsRequest {}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message GetSessionRequest {
  string session_id = 1; // UUID
}

message GetSessionResponse {
  Session session = 1;
}

message WatchSessionRequest {
  string session_id = 1; // UUID
}

message WatchSessionResponse {
  Event event = 1;
}

message WatchSessionsRequest {}

message WatchSessionsResponse {
  oneof kind {
    Snapshot snapshot = 1; // always the first message
    Event change = 2; // Event.session_id and Event.seq say whose and which generation
  }
}

message Snapshot {
  repeated Session sessions = 1; // the newest first, at most 1000
}

// A committed event of a session's chained log (ADR 0029).
message Event {
  string id = 1; // UUIDv7, also the Nats-Msg-Id of what the relay publishes for it
  string session_id = 2;
  uint64 seq = 3; // per session, from 1
  google.protobuf.Timestamp at = 4;
  Change change = 5;
}

// What a command changed. Its deterministic encoding is the event payload. An event's hash is
// sha256(prev_hash || event id (16 bytes) || at (int64 big-endian microseconds since the Unix
// epoch, UTC) || payload), with 32 zero bytes as prev_hash before a session's first event
// (rl-chain documents the encoding).
message Change {
  oneof kind {
    Created created = 1;
    StateChanged state_changed = 2;
    PhaseChanged phase_changed = 3;
    AgentEvent agent_event = 4;
  }
}

message Created {
  string ticket_id = 1;
  string ticket_key = 2;
  string title = 3;
  string namespace = 4;
  rangelight.runner.v1alpha1.DesiredState state = 5; // always DESIRED_STATE_HOT
  string ticket_url = 6; // the ticket in its tracker, https
  string repo = 7; // the git mirror repo it works in
}

message StateChanged {
  rangelight.runner.v1alpha1.DesiredState state = 1;
}

// The runner reported a new phase: one SessionStatus, recorded once however often it arrives.
message PhaseChanged {
  rangelight.runner.v1alpha1.Phase phase = 1;
  string message = 2; // the runner's reason, for example why the session failed
  uint64 observed_generation = 3; // the SessionDesired.generation the runner had applied
  string message_id = 4; // the SessionStatus Envelope.message_id this event records
  google.protobuf.Timestamp sent_at = 5; // the Envelope.sent_at: when the runner sent it
  string pull_request_url = 6; // set on the report that first names the session's PR, empty otherwise
}

// The lane's agent sent an event (api/jsonschema/agent-event.v1alpha1.schema.json), as the api
// validated it: recorded once per message_id. An ask sets the session's question; a progress or
// a worker_done clears it.
message AgentEvent {
  string message_id = 1; // the event's messageId (a UUIDv7)
  google.protobuf.Timestamp sent_at = 2; // the event's at: when the agent emitted it
  oneof kind {
    Ask ask = 3;
    Progress progress = 4;
    WorkerDone worker_done = 5;
    Compacted compacted = 6;
  }
}

// The lane needs its member.
message Ask {
  string question = 1;
  repeated string options = 2; // choices to offer, if any
}

// Feed only, and the start of each turn (stage "turn").
message Progress {
  string stage = 1;
  string note = 2;
}

// The agent says it is done: a claim, never proof (ADR 0045 §3).
message WorkerDone {
  string summary = 1;
  string head_sha = 2;
}

// The agent session's context was compacted.
message Compacted {
  string trigger = 1; // "auto" or "manual"
  string summary = 2;
}
