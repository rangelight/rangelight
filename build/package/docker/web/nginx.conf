# The Workbench's static files. A path without an extension that isn't a file is the app (it routes
# in the browser); any other missing path is a 404.

# Vite names /assets/ files by content hash; everything else is revalidated.
map $uri $rl_cache {
  ~^/assets/ "public, max-age=31536000, immutable";
  default "no-cache";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # Same origin only: the api's Connect calls and the terminal WebSocket (ADR 0040 §4). Inline
  # styles are React's and xterm's style attributes; there is no inline script.
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cache-Control $rl_cache always;

  # Built files never fall back: a missing one is a 404, not the app.
  location ^~ /assets/ {
    try_files $uri =404;
  }

  # App routes have no file extension (/, /sessions/<id>): the app answers them.
  location ~ ^[^.]*$ {
    try_files $uri /index.html;
  }

  location / {
    try_files $uri =404;
  }
}
