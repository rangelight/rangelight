---
# The api's settings (configs/api.default.toml, ADR 0049 §6), as RANGELIGHT_API_<KEY>: connection, sign-in, Linear,
# sessions and the extra CA bundle. Secrets as references, never values.
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "rangelight-api"
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "rangelight.labels" (dict "ctx" $ "name" "api" "component" "config") | nindent 4 }}
data:
  RANGELIGHT_API_DATABASE_URL: {{ printf "secret://%s" (include "rangelight.databaseRef" .) | quote }}
  RANGELIGHT_API_NATS_URL: {{ include "rangelight.natsUrl" . | quote }}
  RANGELIGHT_API_PUBLIC_URL: {{ .Values.publicUrl | quote }}
  {{- if .Values.dex.enabled }}
  RANGELIGHT_API_OIDC_ISSUER: {{ printf "%s/dex" .Values.publicUrl | quote }}
  {{- else }}
  RANGELIGHT_API_OIDC_ISSUER: {{ .Values.oidc.issuer | quote }}
  {{- end }}
  RANGELIGHT_API_OIDC_CLIENT_ID: {{ .Values.oidc.clientId | quote }}
  RANGELIGHT_API_OIDC_MEMBER_CLAIM: {{ .Values.oidc.memberClaim | quote }}
  RANGELIGHT_API_OIDC_CLIENT_SECRET: {{ printf "secret://%s#%s" .Values.oidc.clientSecretRef.name .Values.oidc.clientSecretRef.key | quote }}
  {{- with .Values.tls.extraCaSecretRef }}
  {{- if .name }}
  RANGELIGHT_API_EXTRA_CA_FILE: {{ printf "/var/run/rangelight/secrets/%s/%s" .name .key | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.linear }}
  {{- if .team }}
  RANGELIGHT_API_LINEAR_TEAM: {{ .team | quote }}
  {{- end }}
  {{- if .apiKeySecretRef.name }}
  RANGELIGHT_API_LINEAR_API_KEY: {{ printf "secret://%s#%s" .apiKeySecretRef.name .apiKeySecretRef.key | quote }}
  {{- end }}
  {{- end }}
  RANGELIGHT_API_REPO: {{ required "api.repo is required" .Values.api.repo | quote }}
  RANGELIGHT_API_BASE_REF: {{ .Values.api.baseRef | quote }}
  {{- /* The repo's upstream, from its gitMirror.repos entry: the only repo whose pull requests a session keeps. */}}
  {{- range .Values.gitMirror.repos }}
  {{- if eq .name $.Values.api.repo }}
  RANGELIGHT_API_UPSTREAM: {{ .upstream | quote }}
  {{- end }}
  {{- end }}
  RANGELIGHT_API_MEMBER: {{ required "api.member is required" .Values.api.member | quote }}
  RANGELIGHT_API_STREAM_REPLICAS: {{ .Values.api.streamReplicas | quote }}
{{- if .Values.api.enabled }}
---
# The api's NATS auth callout (configs/api.default.toml [nats_auth], ADR 0021 amendment), as /etc/rangelight/api.toml:
# a list of issuers doesn't fit an environment variable. This cluster's issuer, its keys fetched with the api's own
# token over the cluster CA; the runner here is the one every session runs at.
{{- $seeds := splitList "\n" (include "rangelight.natsSeeds" .) }}
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "rangelight-api-file"
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "rangelight.labels" (dict "ctx" $ "name" "api" "component" "config") | nindent 4 }}
data:
  api.toml: |
    [nats_auth]
    issuer_seed = {{ printf "secret://%s" (index $seeds 0) | quote }}
    auth_user = {{ printf "secret://%s" (index $seeds 1) | quote }}
    {{- if gt (len $seeds) 2 }}
    lane_issuer_seed = {{ printf "secret://%s" (index $seeds 2) | quote }}
    {{- end }}
    account = {{ .Values.nats.auth.account | quote }}
    lane_account = {{ .Values.nats.auth.laneAccount | quote }}

    [[nats_auth.issuers]]
    url = {{ .Values.nats.auth.issuer | quote }}
    jwks_url = "https://kubernetes.default.svc/openid/v1/jwks"
    jwks_token_file = "/var/run/secrets/rangelight/kubernetes/token"
    jwks_ca_file = "/var/run/secrets/rangelight/kubernetes/ca.crt"
    control_plane = true
    runner = "default"
    runner_service_account = {{ printf "%s:runner" .Values.runner.namespace | quote }}
{{- end }}
