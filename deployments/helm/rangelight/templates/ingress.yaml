{{- if .Values.ingress.enabled }}
---
# Browsers reach Rangelight here, at the host of publicUrl: the api's Connect services, sign-in (/auth) and the
# terminal WebSocket (/v1alpha1/sessions/<id>/terminal) go to the api, /dex to bundled Dex, and every other path
# to the Workbench.
{{- $host := regexReplaceAll ":[0-9]+$" (trimPrefix "https://" .Values.publicUrl) "" }}
apiVersion: "networking.k8s.io/v1"
kind: "Ingress"
metadata:
  name: "rangelight"
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "rangelight.labels" (dict "ctx" $ "name" "ingress" "component" "ingress") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- range $key, $value := . }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.tls.secretName }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ . | quote }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          {{- $connect := list "/rangelight.auth.v1alpha1.AuthService" "/rangelight.session.v1alpha1.SessionService" }}
          {{- range concat $connect (list "/auth" "/v1alpha1/sessions") }}
          - path: {{ . | quote }}
            pathType: "Prefix"
            backend:
              service:
                name: "rangelight-api"
                port:
                  name: "http"
          {{- end }}
          {{- if .Values.dex.enabled }}
          - path: "/dex"
            pathType: "Prefix"
            backend:
              service:
                name: {{ .Values.dex.fullnameOverride | quote }}
                port:
                  number: 5556
          {{- end }}
          - path: "/"
            pathType: "Prefix"
            backend:
              service:
                name: "rangelight-web"
                port:
                  name: "http"
{{- end }}
