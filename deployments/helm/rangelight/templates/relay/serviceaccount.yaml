{{- if .Values.relay.enabled }}
---
# The relay's identity: NATS's auth callout maps its projected token to the relay (ADR 0021 amendment). No Kubernetes
# permission.
apiVersion: "v1"
kind: "ServiceAccount"
metadata:
  name: "rangelight-relay"
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "rangelight.labels" (dict "ctx" $ "name" "relay" "component" "control-plane") | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
