{{- if .Values.api.enabled }}
---
# The api's identity: NATS's auth callout maps its projected token to the api (ADR 0021 amendment). It holds no
# Kubernetes permission but reading the cluster's ServiceAccount token issuer, below.
apiVersion: "v1"
kind: "ServiceAccount"
metadata:
  name: "rangelight-api"
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "rangelight.labels" (dict "ctx" $ "name" "api" "component" "control-plane") | nindent 4 }}
automountServiceAccountToken: false
---
# The cluster's token signing keys (/openid/v1/jwks), to verify NATS clients' tokens. Kubernetes grants the same role
# to every ServiceAccount by default; this binding keeps the api working where that default was removed.
apiVersion: "rbac.authorization.k8s.io/v1"
kind: "ClusterRoleBinding"
metadata:
  name: "rangelight-api-issuer-discovery"
  labels:
    {{- include "rangelight.labels" (dict "ctx" $ "name" "api" "component" "control-plane") | nindent 4 }}
roleRef:
  apiGroup: "rbac.authorization.k8s.io"
  kind: "ClusterRole"
  name: "system:service-account-issuer-discovery"
subjects:
  - kind: "ServiceAccount"
    name: "rangelight-api"
    namespace: {{ .Release.Namespace | quote }}
{{- end }}
